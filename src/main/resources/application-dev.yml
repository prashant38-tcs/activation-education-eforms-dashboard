spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eforms_dashboard_dev?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USER:eforms_dev}
    password: ${DB_PASSWORD:change_me_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  sample-data:
    enabled: true
    note: "All records seeded in dev profile are SYNTHETIC / DEVELOPMENT-ONLY data and must never be treated as production data."

logging:
  level:
    com.tcsion.eforms: DEBUG
