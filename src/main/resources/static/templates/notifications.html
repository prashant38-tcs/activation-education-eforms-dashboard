<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Notifications - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Notifications (<span th:text="${unreadCount}"></span> unread)</h4>
      <form method="post" th:action="@{/notifications/mark-all-read}"><button class="btn btn-sm btn-outline-secondary">Mark All Read</button></form>
    </div>
    <div class="list-group">
      <div class="list-group-item" th:each="n : ${notifications.content}" th:classappend="${n.read} ? '' : 'bg-light'">
        <div class="d-flex justify-content-between">
          <strong th:text="${n.title}"></strong>
          <span class="text-muted small" th:text="${n.createdAt}"></span>
        </div>
        <div th:text="${n.message}"></div>
        <div class="mt-1 d-flex gap-2">
          <a th:if="${n.relatedTicket != null}" th:href="@{'/tickets/' + ${n.relatedTicket.id}}" class="btn btn-sm btn-link p-0">View Ticket</a>
          <form th:if="${!n.read}" method="post" th:action="@{'/notifications/' + ${n.id} + '/read'}"><button class="btn btn-sm btn-link p-0">Mark as read</button></form>
        </div>
      </div>
      <div th:if="${notifications.totalElements == 0}" class="empty-state">No notifications yet.</div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
