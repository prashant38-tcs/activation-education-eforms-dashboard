<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>SLA Risk Explanation - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4>Why is <span th:text="${ticket.ticketNumber}"></span> High Risk?</h4>
    <div class="card p-3">
      <p>Risk Score: <strong th:text="${ticket.slaRiskScore}"></strong> (<span th:text="${ticket.slaRiskCategory}"></span>)</p>
      <ul>
        <li th:each="r : ${reasons}" th:text="${r}"></li>
      </ul>
    </div>
    <a th:href="@{/sla-risk}" class="btn btn-outline-secondary mt-3">Back to SLA Risk Dashboard</a>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
