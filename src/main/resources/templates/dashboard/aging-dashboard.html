<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Ticket Aging - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">Ticket Aging Dashboard</h4>
    <div class="row g-3 mb-3">
      <div class="col-6 col-md-3"><a th:href="@{/aging(bucket='HEALTHY')}" class="text-decoration-none"><div class="card card-metric p-3 border-success"><div class="metric-value text-success" th:text="${bucketCounts.HEALTHY}"></div><div class="metric-label">Healthy (0-3d)</div></div></a></div>
      <div class="col-6 col-md-3"><a th:href="@{/aging(bucket='ATTENTION')}" class="text-decoration-none"><div class="card card-metric p-3 border-warning"><div class="metric-value text-warning" th:text="${bucketCounts.ATTENTION}"></div><div class="metric-label">Needs Attention (4-7d)</div></div></a></div>
      <div class="col-6 col-md-3"><a th:href="@{/aging(bucket='AT_RISK')}" class="text-decoration-none"><div class="card card-metric p-3" style="border-color:#ed8936;"><div class="metric-value" style="color:#ed8936" th:text="${bucketCounts.AT_RISK}"></div><div class="metric-label">At Risk (8-15d)</div></div></a></div>
      <div class="col-6 col-md-3"><a th:href="@{/aging(bucket='CRITICAL')}" class="text-decoration-none"><div class="card card-metric p-3 border-danger"><div class="metric-value text-danger" th:text="${bucketCounts.CRITICAL}"></div><div class="metric-label">Critical (>15d)</div></div></a></div>
    </div>
    <p th:if="${selectedBucket}">Filtered by bucket: <strong th:text="${selectedBucket}"></strong> — <a th:href="@{/aging}">Clear filter</a></p>

    <div class="table-responsive card p-2">
      <table class="table table-sm">
        <thead><tr><th>Ticket #</th><th>Customer</th><th>Developer</th><th>Status</th><th>Assignment Date</th><th>Aging Days</th><th>Last Activity</th><th>Est. Production</th></tr></thead>
        <tbody>
        <tr th:each="t : ${tickets}">
          <td><a th:href="@{'/tickets/' + ${t.id}}" th:text="${t.ticketNumber}"></a></td>
          <td th:text="${t.customer != null ? t.customer.customerName : ''}"></td>
          <td th:text="${t.assignedUser != null ? t.assignedUser.fullName : 'Unassigned'}"></td>
          <td th:text="${t.currentStatus.displayName}"></td>
          <td th:text="${t.assignmentDate}"></td>
          <td th:text="${t.agingDays}"></td>
          <td th:text="${t.lastActivityDate}"></td>
          <td th:text="${t.estimatedProductionDate}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
