<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Team Capacity - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">Team Capacity</h4>
    <p class="text-muted">Operational workload view for assignment balancing only.</p>
    <div class="table-responsive card p-2">
      <table class="table table-sm">
        <thead><tr><th>Developer</th><th>Total Active</th><th>WIP</th><th>UAT</th><th>QA</th><th>On Hold</th><th>Framework Pending</th><th>Other-Team Pending</th><th>High Risk</th><th>Overdue</th><th>No Update</th><th>Workload</th></tr></thead>
        <tbody>
        <tr th:each="row : ${rows}">
          <td th:text="${row.developer.fullName}"></td>
          <td th:text="${row.totalActive}"></td>
          <td th:text="${row.wip}"></td>
          <td th:text="${row.uat}"></td>
          <td th:text="${row.qa}"></td>
          <td th:text="${row.onHold}"></td>
          <td th:text="${row.frameworkPending}"></td>
          <td th:text="${row.otherTeamPending}"></td>
          <td th:text="${row.highRisk}"></td>
          <td th:text="${row.overdue}"></td>
          <td th:text="${row.noUpdate}"></td>
          <td>
            <span th:switch="${row.workloadIndicator}">
              <span th:case="'Available'" class="badge bg-success">Available</span>
              <span th:case="'Normal'" class="badge bg-info text-dark">Normal</span>
              <span th:case="'High'" class="badge bg-warning text-dark">High</span>
              <span th:case="'Critical'" class="badge bg-danger">Critical</span>
            </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
