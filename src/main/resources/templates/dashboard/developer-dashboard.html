<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/><title>My Dashboard - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">My Dashboard</h4>
    <div class="row g-3">
      <div class="col-6 col-md-3">
        <a th:href="@{/tickets/my}" class="text-decoration-none">
        <div class="card card-metric p-3"><div class="metric-value" th:text="${totalTickets}">0</div><div class="metric-label">My Total Tickets</div></div></a>
      </div>
      <div class="col-6 col-md-3">
        <a th:href="@{/tickets/my}" class="text-decoration-none">
        <div class="card card-metric p-3"><div class="metric-value" th:text="${wipCount}">0</div><div class="metric-label">Work In Progress</div></div></a>
      </div>
      <div class="col-6 col-md-3">
        <a th:href="@{/tickets/my}" class="text-decoration-none">
        <div class="card card-metric p-3"><div class="metric-value" th:text="${uatCount}">0</div><div class="metric-label">UAT Tickets</div></div></a>
      </div>
      <div class="col-6 col-md-3">
        <a th:href="@{/tickets/my}" class="text-decoration-none">
        <div class="card card-metric p-3"><div class="metric-value" th:text="${qaCount}">0</div><div class="metric-label">QA Tickets</div></div></a>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-metric p-3"><div class="metric-value" th:text="${onHoldCount}">0</div><div class="metric-label">On Hold</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-metric p-3"><div class="metric-value" th:text="${frameworkDependencyCount}">0</div><div class="metric-label">Framework Dependencies</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-metric p-3"><div class="metric-value" th:text="${otherTeamDependencyCount}">0</div><div class="metric-label">Other-Team Dependencies</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-metric p-3 border-danger"><div class="metric-value text-danger" th:text="${overdueCount}">0</div><div class="metric-label">Overdue</div></div>
      </div>
      <div class="col-6 col-md-3">
        <a th:href="@{/sla-risk}" class="text-decoration-none">
        <div class="card card-metric p-3 border-danger"><div class="metric-value text-danger" th:text="${highRiskCount}">0</div><div class="metric-label">High-Risk Tickets</div></div></a>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-metric p-3"><div class="metric-value" th:text="${noUpdateCount}">0</div><div class="metric-label">Tickets Without Update</div></div>
      </div>
      <div class="col-6 col-md-3">
        <a th:href="@{/wsr/daily}" class="text-decoration-none">
        <div class="card card-metric p-3"><div class="metric-value"><i class="bi bi-journal-text"></i></div><div class="metric-label">My Daily WSR</div></div></a>
      </div>
    </div>

    <h5 class="mt-4 mb-2">My Recent Activities</h5>
    <div class="table-responsive card p-2">
      <table class="table table-sm mb-0">
        <thead><tr><th>Ticket #</th><th>Title</th><th>Status</th><th>Priority</th><th>Aging</th><th>SLA Risk</th></tr></thead>
        <tbody>
        <tr th:each="t : ${recentTickets}">
          <td><a th:href="@{'/tickets/' + ${t.id}}" th:text="${t.ticketNumber}"></a></td>
          <td th:text="${t.ticketTitle}"></td>
          <td><span class="badge bg-secondary" th:text="${t.currentStatus.displayName}"></span></td>
          <td th:text="${t.priority != null ? t.priority.priorityName : ''}"></td>
          <td th:text="${t.agingDays}"></td>
          <td><span th:class="'badge badge-risk-' + ${#strings.toLowerCase(t.slaRiskCategory)}" th:text="${t.slaRiskCategory}"></span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(recentTickets)}"><td colspan="6" class="empty-state">No tickets assigned yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
