<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>SLA Risk - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">SLA Risk Dashboard</h4>
    <div class="row g-3 mb-3">
      <div class="col-md-3"><div class="card card-metric p-3 border-success"><div class="metric-value text-success" th:text="${slaMet}"></div><div class="metric-label">SLA Met</div></div></div>
      <div class="col-md-3"><div class="card card-metric p-3 border-warning"><div class="metric-value text-warning" th:text="${slaAtRisk}"></div><div class="metric-label">SLA At Risk</div></div></div>
      <div class="col-md-3"><div class="card card-metric p-3 border-danger"><div class="metric-value text-danger" th:text="${slaBreached}"></div><div class="metric-label">SLA Breached</div></div></div>
      <div class="col-md-3"><div class="card card-metric p-3"><div class="metric-value" th:text="${complianceRate} + '%'"></div><div class="metric-label">SLA Compliance</div></div></div>
    </div>

    <h6>High-Risk Tickets (with explanation)</h6>
    <div class="table-responsive card p-2 mb-3">
      <table class="table table-sm">
        <thead><tr><th>Ticket #</th><th>Customer</th><th>Developer</th><th>Risk Score</th><th></th></tr></thead>
        <tbody>
        <tr th:each="t : ${highRiskTickets}">
          <td><a th:href="@{'/tickets/' + ${t.id}}" th:text="${t.ticketNumber}"></a></td>
          <td th:text="${t.customer != null ? t.customer.customerName : ''}"></td>
          <td th:text="${t.assignedUser != null ? t.assignedUser.fullName : 'Unassigned'}"></td>
          <td th:text="${t.slaRiskScore}"></td>
          <td><a th:href="@{'/sla-risk/' + ${t.id} + '/explain'}" class="btn btn-sm btn-outline-danger">Why High Risk?</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(highRiskTickets)}"><td colspan="5" class="empty-state">No high-risk tickets currently.</td></tr>
        </tbody>
      </table>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <h6>Risk By Customer</h6>
        <ul class="list-group"><li class="list-group-item d-flex justify-content-between" th:each="e : ${riskByCustomer}"><span th:text="${e.key}"></span><span th:text="${e.value}"></span></li></ul>
      </div>
      <div class="col-md-6">
        <h6>Risk By Status</h6>
        <ul class="list-group"><li class="list-group-item d-flex justify-content-between" th:each="e : ${riskByStatus}"><span th:text="${e.key}"></span><span th:text="${e.value}"></span></li></ul>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
