<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>My Profile - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">My Profile</h4>
    <div class="card p-3" style="max-width:480px;">
      <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
      <p><strong>Full Name:</strong> <span th:text="${user.fullName}"></span></p>
      <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
      <p><strong>Roles:</strong> <span th:each="r : ${user.roles}" class="badge bg-secondary me-1" th:text="${r.roleCode}"></span></p>
      <p><strong>Last Login:</strong> <span th:text="${user.lastLoginAt}"></span> from <span th:text="${user.lastLoginIp}"></span></p>
      <a th:href="@{/change-password}" class="btn btn-outline-primary btn-sm">Change Password</a>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
