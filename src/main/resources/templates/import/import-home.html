<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Import Tickets - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">Import Tickets</h4>
    <div class="card p-4 mb-3">
      <p>Upload an Excel (.xlsx) file using the required column layout. <a th:href="@{/import/template}">Download the import template</a> to get started.</p>
      <form method="post" th:action="@{/import/upload}" enctype="multipart/form-data" class="row g-2">
        <div class="col-md-8"><input type="file" name="file" accept=".xlsx,.xls" class="form-control" required/></div>
        <div class="col-md-4"><button class="btn btn-primary w-100">Upload &amp; Preview</button></div>
      </form>
    </div>

    <h6>Recent Import Batches</h6>
    <div class="table-responsive card p-2">
      <table class="table table-sm">
        <thead><tr><th>File</th><th>Uploaded By</th><th>Date</th><th>Status</th><th>Result</th><th></th></tr></thead>
        <tbody>
        <tr th:each="b : ${recentBatches}">
          <td th:text="${b.originalFileName}"></td>
          <td th:text="${b.uploadedBy.fullName}"></td>
          <td th:text="${b.uploadedAt}"></td>
          <td><span class="badge bg-secondary" th:text="${b.processingStatus}"></span></td>
          <td th:text="${b.processingResult}"></td>
          <td><a th:if="${b.processingStatus == 'PENDING_PREVIEW'}" th:href="@{'/import/' + ${b.id} + '/preview'}" class="btn btn-sm btn-outline-primary">Review</a>
              <a th:if="${b.processingStatus == 'COMPLETED'}" th:href="@{'/import/' + ${b.id} + '/result'}" class="btn btn-sm btn-outline-secondary">Result</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(recentBatches)}"><td colspan="6" class="empty-state">No imports have been performed yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
