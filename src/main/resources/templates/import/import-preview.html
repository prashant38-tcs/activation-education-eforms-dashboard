<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Import Preview - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">Import Preview: <span th:text="${batch.originalFileName}"></span></h4>
    <div class="alert alert-info" th:text="${batch.processingResult}"></div>

    <div class="table-responsive card p-2 mb-3">
      <table class="table table-sm">
        <thead><tr><th>Row</th><th>Ticket #</th><th>CRM ID</th><th>Classification</th><th>Error Reason</th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}">
          <td th:text="${r.rowNumber}"></td>
          <td th:text="${r.ticketNumber}"></td>
          <td th:text="${r.crmId}"></td>
          <td>
            <span th:switch="${r.rowClassification}">
              <span th:case="'NEW'" class="badge bg-success">New</span>
              <span th:case="'EXISTING_CHANGED'" class="badge bg-warning text-dark">Existing - Changed</span>
              <span th:case="'EXISTING_UNCHANGED'" class="badge bg-secondary">Existing - Unchanged</span>
              <span th:case="'INVALID'" class="badge bg-danger">Invalid</span>
              <span th:case="'DUPLICATE_IN_FILE'" class="badge bg-dark">Duplicate In File</span>
            </span>
          </td>
          <td th:text="${r.errorReason}"></td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex gap-2">
      <form method="post" th:action="@{'/import/' + ${batch.id} + '/confirm'}" data-confirm="Confirm this import? New and changed tickets will be saved.">
        <button class="btn btn-primary">Confirm Import</button>
      </form>
      <form method="post" th:action="@{'/import/' + ${batch.id} + '/cancel'}" data-confirm="Cancel this import?">
        <button class="btn btn-outline-danger">Cancel Import</button>
      </form>
      <a th:href="@{'/import/' + ${batch.id} + '/errors'}" class="btn btn-outline-secondary">Download Rejected Rows</a>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
