<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Import Result - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">Import Result</h4>
    <div class="row g-3 mb-3">
      <div class="col-md-3"><div class="card card-metric p-3"><div class="metric-value" th:text="${batch.insertedCount}"></div><div class="metric-label">Inserted</div></div></div>
      <div class="col-md-3"><div class="card card-metric p-3"><div class="metric-value" th:text="${batch.updatedCount}"></div><div class="metric-label">Updated</div></div></div>
      <div class="col-md-3"><div class="card card-metric p-3 border-danger"><div class="metric-value text-danger" th:text="${batch.rejectedCount}"></div><div class="metric-label">Rejected</div></div></div>
      <div class="col-md-3"><div class="card card-metric p-3"><div class="metric-value" th:text="${batch.duplicateCount}"></div><div class="metric-label">Duplicates</div></div></div>
    </div>
    <a th:href="@{'/import/' + ${batch.id} + '/errors'}" class="btn btn-outline-secondary">Download Rejected Rows</a>
    <a th:href="@{/tickets/all}" class="btn btn-primary">View All Tickets</a>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
