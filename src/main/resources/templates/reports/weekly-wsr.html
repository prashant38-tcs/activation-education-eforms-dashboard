<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Weekly WSR - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">Weekly WSR — <span th:text="${weekStart}"></span> to <span th:text="${weekEnd}"></span></h4>
    <div class="table-responsive card p-2">
      <table class="table table-sm">
        <thead><tr><th>Date</th><th>Developer</th><th>Ticket #</th><th>Activity Type</th><th>Status</th><th>Remark</th></tr></thead>
        <tbody>
        <tr th:each="e : ${entries}">
          <td th:text="${e.snapshotDate}"></td>
          <td th:text="${e.developer.fullName}"></td>
          <td><a th:href="@{'/tickets/' + ${e.ticket.id}}" th:text="${e.ticket.ticketNumber}"></a></td>
          <td th:text="${e.activityType != null ? e.activityType.typeName : ''}"></td>
          <td th:text="${e.currentStatus != null ? e.currentStatus.displayName : ''}"></td>
          <td th:text="${e.remark}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(entries)}"><td colspan="6" class="empty-state">No WSR activity recorded for this week.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
