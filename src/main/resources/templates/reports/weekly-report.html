<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Weekly Report - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Weekly Report — <span th:text="${report.weekStart}"></span> to <span th:text="${report.weekEnd}"></span></h4>
    </div>
    <div class="table-responsive card p-2">
      <table class="table table-sm">
        <thead><tr><th>Customer</th><th>Ticket #</th><th>Planned Milestone</th><th>Developer</th><th>Status</th><th>Production Date</th><th>Risk</th><th>SLA</th></tr></thead>
        <tbody>
        <tr th:each="t : ${report.tickets}">
          <td th:text="${t.customer != null ? t.customer.customerName : ''}"></td>
          <td><a th:href="@{'/tickets/' + ${t.id}}" th:text="${t.ticketNumber}"></a></td>
          <td th:text="${t.shortPlannedMilestone}"></td>
          <td th:text="${t.assignedUser != null ? t.assignedUser.fullName : 'Unassigned'}"></td>
          <td th:text="${t.currentStatus.displayName}"></td>
          <td th:text="${t.actualProductionDate != null ? t.actualProductionDate : t.estimatedProductionDate}"></td>
          <td th:text="${t.slaRiskCategory}"></td>
          <td th:text="${t.slaState}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
