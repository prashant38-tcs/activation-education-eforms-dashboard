<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Daily WSR - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">Daily WSR — <span th:text="${selectedDate}"></span></h4>
    <form class="row g-2 mb-3" method="get">
      <div class="col-md-3"><input type="date" name="date" class="form-control" th:value="${selectedDate}"/></div>
      <div class="col-md-2"><button class="btn btn-outline-primary">Go</button></div>
    </form>
    <div class="table-responsive card p-2">
      <table class="table table-sm">
        <thead><tr><th>Developer</th><th>Ticket #</th><th>Customer</th><th>Activity Type</th><th>Status</th><th>Progress %</th><th>Hours</th><th>Remark</th></tr></thead>
        <tbody>
        <tr th:each="e : ${entries}">
          <td th:text="${e.developer.fullName}"></td>
          <td><a th:href="@{'/tickets/' + ${e.ticket.id}}" th:text="${e.ticket.ticketNumber}"></a></td>
          <td th:text="${e.customer != null ? e.customer.customerName : ''}"></td>
          <td th:text="${e.activityType != null ? e.activityType.typeName : ''}"></td>
          <td th:text="${e.currentStatus != null ? e.currentStatus.displayName : ''}"></td>
          <td th:text="${e.progressPercentage}"></td>
          <td th:text="${e.hoursSpent}"></td>
          <td th:text="${e.remark}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(entries)}"><td colspan="8" class="empty-state">No WSR activity recorded for this date.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
