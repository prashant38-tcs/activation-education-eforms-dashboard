<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center" style="min-height:100vh; background:linear-gradient(135deg,#2b6cb0,#1a365d);">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0">
        <div class="card-body p-4">
          <h4 class="text-center mb-1">Activation Education EForms</h4>
          <p class="text-center text-muted mb-4">Ticket Lifecycle &amp; Delivery Management Dashboard</p>

          <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
          <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>
          <div th:if="${param.passwordChanged}" class="alert alert-success">Password updated. Please log in with your new password.</div>

          <form th:action="@{/perform-login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" name="username" class="form-control" required autofocus/>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input type="password" id="loginPassword" name="password" class="form-control" required/>
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="#loginPassword">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
          </form>
          <div class="text-center mt-3">
            <a th:href="@{/forgot-password}">Forgot your password?</a>
          </div>
        </div>
      </div>
      <p class="text-center text-white-50 mt-3 small">Internal application - Activation Education EForms Team</p>
    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
