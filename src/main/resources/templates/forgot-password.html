<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Forgot Password - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center" style="min-height:100vh; background:linear-gradient(135deg,#2b6cb0,#1a365d);">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0">
        <div class="card-body p-4">
          <h5 class="mb-3">Forgot Password</h5>
          <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>
          <form th:action="@{/forgot-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" name="username" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100">Request Reset</button>
          </form>
          <div class="text-center mt-3"><a th:href="@{/login}">Back to login</a></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
