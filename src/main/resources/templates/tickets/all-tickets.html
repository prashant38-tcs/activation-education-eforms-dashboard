<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>All Tickets - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">All Tickets</h4>
      <a th:href="@{/tickets/new}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> New Ticket</a>
    </div>

    <form class="row g-2 mb-3 card p-3" method="get" th:action="@{/tickets/all}">
      <div class="col-md-3"><input type="text" name="search" class="form-control" placeholder="Search ticket #, title, CRM ID" th:value="${param.search}"/></div>
      <div class="col-md-2">
        <select name="statusId" class="form-select">
          <option value="">All Statuses</option>
          <option th:each="s : ${statuses}" th:value="${s.id}" th:text="${s.displayName}"></option>
        </select>
      </div>
      <div class="col-md-2">
        <select name="customerId" class="form-select">
          <option value="">All Customers</option>
          <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.customerName}"></option>
        </select>
      </div>
      <div class="col-md-2">
        <select name="developerId" class="form-select">
          <option value="">All Developers</option>
          <option th:each="d : ${developers}" th:value="${d.id}" th:text="${d.fullName}"></option>
        </select>
      </div>
      <div class="col-md-2">
        <select name="riskCategory" class="form-select">
          <option value="">All Risk Levels</option>
          <option value="LOW">Low Risk</option><option value="MEDIUM">Medium Risk</option><option value="HIGH">High Risk</option>
        </select>
      </div>
      <div class="col-md-1 d-grid"><button class="btn btn-outline-primary" type="submit"><i class="bi bi-funnel"></i></button></div>
      <div class="col-12"><a th:href="@{/tickets/all}" class="btn btn-sm btn-link">Clear Filters</a></div>
    </form>

    <div class="table-responsive card p-2">
      <table class="table table-hover">
        <thead><tr><th>Ticket #</th><th>Title</th><th>Customer</th><th>Developer</th><th>Status</th><th>Priority</th><th>Aging</th><th>SLA Risk</th></tr></thead>
        <tbody>
        <tr th:each="t : ${tickets.content}">
          <td><a th:href="@{'/tickets/' + ${t.id}}" th:text="${t.ticketNumber}"></a></td>
          <td th:text="${t.ticketTitle}"></td>
          <td th:text="${t.customer != null ? t.customer.customerName : ''}"></td>
          <td th:text="${t.assignedUser != null ? t.assignedUser.fullName : 'Unassigned'}"></td>
          <td><span class="badge bg-secondary" th:text="${t.currentStatus.displayName}"></span></td>
          <td th:text="${t.priority != null ? t.priority.priorityName : ''}"></td>
          <td th:text="${t.agingDays}"></td>
          <td><span th:class="'badge badge-risk-' + ${#strings.toLowerCase(t.slaRiskCategory)}" th:text="${t.slaRiskCategory}"></span></td>
        </tr>
        <tr th:if="${tickets.totalElements == 0}"><td colspan="8" class="empty-state">No tickets match the selected filters.</td></tr>
        </tbody>
      </table>
      <nav th:if="${tickets.totalPages > 1}">
        <ul class="pagination pagination-sm">
          <li class="page-item" th:each="p : ${#numbers.sequence(0, tickets.totalPages - 1)}" th:classappend="${p == tickets.number} ? 'active'">
            <a class="page-link" th:href="@{/tickets/all(page=${p})}" th:text="${p + 1}"></a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
