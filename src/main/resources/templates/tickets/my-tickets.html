<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>My Tickets - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">My Tickets</h4>
    <div class="table-responsive card p-2">
      <table class="table table-hover ae-datatable">
        <thead><tr><th>Ticket #</th><th>Title</th><th>Customer</th><th>Status</th><th>Priority</th><th>Aging</th><th>SLA Risk</th><th>Est. Production Date</th></tr></thead>
        <tbody>
        <tr th:each="t : ${tickets.content}">
          <td><a th:href="@{'/tickets/' + ${t.id}}" th:text="${t.ticketNumber}"></a></td>
          <td th:text="${t.ticketTitle}"></td>
          <td th:text="${t.customer != null ? t.customer.customerName : ''}"></td>
          <td><span class="badge bg-secondary" th:text="${t.currentStatus.displayName}"></span></td>
          <td th:text="${t.priority != null ? t.priority.priorityName : ''}"></td>
          <td th:text="${t.agingDays}"></td>
          <td><span th:class="'badge badge-risk-' + ${#strings.toLowerCase(t.slaRiskCategory)}" th:text="${t.slaRiskCategory}"></span></td>
          <td th:text="${t.estimatedProductionDate}"></td>
        </tr>
        </tbody>
      </table>
      <div th:if="${tickets.totalElements == 0}" class="empty-state">No tickets assigned to you yet.</div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
