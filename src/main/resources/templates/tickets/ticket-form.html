<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>New Ticket - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a th:href="@{/tickets/all}">All Tickets</a></li><li class="breadcrumb-item active">New Ticket</li></ol></nav>
    <div class="card p-4">
      <form method="post" th:action="@{/tickets/new}" th:object="${ticketCreateRequest}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Ticket Number *</label><input th:field="*{ticketNumber}" class="form-control" required/></div>
          <div class="col-md-4"><label class="form-label">CRM ID</label><input th:field="*{crmId}" class="form-control"/></div>
          <div class="col-md-4">
            <label class="form-label">Customer *</label>
            <select th:field="*{customerId}" class="form-select" required>
              <option value="">Select customer</option>
              <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.customerName}"></option>
            </select>
          </div>
          <div class="col-md-8"><label class="form-label">Ticket Title *</label><input th:field="*{ticketTitle}" class="form-control" required/></div>
          <div class="col-md-4">
            <label class="form-label">Ticket Type *</label>
            <select th:field="*{ticketTypeId}" class="form-select" required>
              <option value="">Select type</option>
              <option th:each="t : ${ticketTypes}" th:value="${t.id}" th:text="${t.typeName}"></option>
            </select>
          </div>
          <div class="col-12"><label class="form-label">Ticket Description</label><textarea th:field="*{ticketDescription}" class="form-control" rows="3"></textarea></div>
          <div class="col-md-4">
            <label class="form-label">Priority *</label>
            <select th:field="*{priorityId}" class="form-select" required>
              <option value="">Select priority</option>
              <option th:each="p : ${priorities}" th:value="${p.id}" th:text="${p.priorityName}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Severity *</label>
            <select th:field="*{severityId}" class="form-select" required>
              <option value="">Select severity</option>
              <option th:each="s : ${severities}" th:value="${s.id}" th:text="${s.severityName}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Assign To Developer</label>
            <select th:field="*{assignedUserId}" class="form-select">
              <option value="">Unassigned</option>
              <option th:each="d : ${developers}" th:value="${d.id}" th:text="${d.fullName}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Source Team</label>
            <select th:field="*{sourceTeamId}" class="form-select">
              <option value="">None</option>
              <option th:each="tm : ${teams}" th:value="${tm.id}" th:text="${tm.teamName}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Dependency Team</label>
            <select th:field="*{dependencyTeamId}" class="form-select">
              <option value="">None</option>
              <option th:each="tm : ${teams}" th:value="${tm.id}" th:text="${tm.teamName}"></option>
            </select>
          </div>
          <div class="col-md-4"><label class="form-label">Expected Closure Date</label><input type="date" th:field="*{expectedClosureDate}" class="form-control"/></div>
          <div class="col-md-4"><label class="form-label">Estimated Production Date</label><input type="date" th:field="*{estimatedProductionDate}" class="form-control"/></div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Create Ticket</button>
          <a th:href="@{/tickets/all}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
