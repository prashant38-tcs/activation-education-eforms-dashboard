<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:#f5f7fa;">
<div class="text-center">
  <h1 class="display-4">404</h1>
  <p class="text-muted" th:text="${message} ?: 'The requested resource was not found.'"></p>
  <a th:href="@{/dashboard}" class="btn btn-primary">Return to Dashboard</a>
</div>
</body>
</html>
