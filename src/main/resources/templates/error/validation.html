<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Validation Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:#f5f7fa;">
<div class="card p-4" style="max-width:520px;">
  <h5 class="text-danger">Please correct the following:</h5>
  <ul><li th:each="e : ${errors}" th:text="${e}"></li></ul>
  <a th:href="@{/dashboard}" class="btn btn-primary mt-2">Return to Dashboard</a>
</div>
</body>
</html>
