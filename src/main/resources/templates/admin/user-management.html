<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>User Management - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">User Management</h4>
    <div th:if="${temporaryPasswordMessage}" class="alert alert-success" th:text="${temporaryPasswordMessage}"></div>
    <div th:if="${param.passwordReset}" class="alert alert-info">Password has been reset. Please share the new temporary password securely with the user out-of-band.</div>

    <div class="card p-3 mb-3">
      <h6>Create New User</h6>
      <form method="post" th:action="@{/user-management/create}" th:object="${userCreateRequest}" class="row g-2">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="col-md-3"><input th:field="*{username}" class="form-control" placeholder="Username *" required/></div>
        <div class="col-md-3"><input th:field="*{fullName}" class="form-control" placeholder="Full Name *" required/></div>
        <div class="col-md-3"><input th:field="*{email}" type="email" class="form-control" placeholder="Email"/></div>
        <div class="col-md-3">
          <select th:field="*{roleCodes}" class="form-select" multiple required>
            <option th:each="r : ${roles}" th:value="${r.roleCode}" th:text="${r.roleName}"></option>
          </select>
        </div>
        <div class="col-12"><button class="btn btn-primary">Create User</button></div>
      </form>
    </div>

    <div class="table-responsive card p-2">
      <table class="table table-sm">
        <thead><tr><th>Username</th><th>Full Name</th><th>Roles</th><th>Active</th><th>Locked</th><th>Last Login</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.username}"></td>
          <td th:text="${u.fullName}"></td>
          <td><span th:each="r : ${u.roles}" class="badge bg-secondary me-1" th:text="${r.roleCode}"></span></td>
          <td><span th:if="${u.active}" class="badge bg-success">Active</span><span th:unless="${u.active}" class="badge bg-danger">Inactive</span></td>
          <td><span th:if="${u.accountLocked}" class="badge bg-warning text-dark">Locked</span></td>
          <td th:text="${u.lastLoginAt}"></td>
          <td class="d-flex gap-1">
            <form method="post" th:if="${u.active}" th:action="@{'/user-management/' + ${u.id} + '/deactivate'}"><button class="btn btn-sm btn-outline-danger">Deactivate</button></form>
            <form method="post" th:unless="${u.active}" th:action="@{'/user-management/' + ${u.id} + '/activate'}"><button class="btn btn-sm btn-outline-success">Activate</button></form>
            <form method="post" th:action="@{'/user-management/' + ${u.id} + '/reset-password'}" data-confirm="Reset this user's password?"><button class="btn btn-sm btn-outline-secondary">Reset Password</button></form>
            <form method="post" th:if="${u.accountLocked}" th:action="@{'/user-management/' + ${u.id} + '/unlock'}"><button class="btn btn-sm btn-outline-warning">Unlock</button></form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
