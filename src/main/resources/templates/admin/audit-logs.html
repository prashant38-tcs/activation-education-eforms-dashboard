<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Audit Logs - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <div class="ae-content flex-grow-1">
    <h4 class="mb-3">Audit Logs</h4>
    <form class="row g-2 mb-3" method="get">
      <div class="col-md-3"><input name="action" class="form-control" placeholder="Action (e.g. STATUS_CHANGED)"/></div>
      <div class="col-md-3"><input name="ticketNumber" class="form-control" placeholder="Ticket Number"/></div>
      <div class="col-md-3"><input name="userName" class="form-control" placeholder="User"/></div>
      <div class="col-md-2"><button class="btn btn-outline-primary w-100">Filter</button></div>
    </form>
    <div class="table-responsive card p-2">
      <table class="table table-sm">
        <thead><tr><th>Date</th><th>User</th><th>Role</th><th>Action</th><th>Entity</th><th>Ticket #</th><th>Old</th><th>New</th><th>IP</th></tr></thead>
        <tbody>
        <tr th:each="log : ${logs.content}">
          <td th:text="${log.createdAt}"></td>
          <td th:text="${log.userName}"></td>
          <td th:text="${log.roleSnapshot}"></td>
          <td th:text="${log.action}"></td>
          <td th:text="${log.entityType}"></td>
          <td th:text="${log.ticketNumber}"></td>
          <td th:text="${log.oldValue}"></td>
          <td th:text="${log.newValue}"></td>
          <td th:text="${log.ipAddress}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
