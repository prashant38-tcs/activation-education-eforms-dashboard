<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Change Password - Activation Education EForms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center" style="min-height:100vh; background:linear-gradient(135deg,#2b6cb0,#1a365d);">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0">
        <div class="card-body p-4">
          <h5 class="mb-1">Change Password</h5>
          <p class="text-muted small" th:if="${firstLogin}">This is your first login. Please set a new password to continue.</p>
          <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
          <form th:action="@{/change-password}" th:object="${changePasswordRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3" th:unless="${firstLogin}">
              <label class="form-label">Current Password</label>
              <input type="password" th:field="*{currentPassword}" class="form-control"/>
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" th:field="*{newPassword}" class="form-control" minlength="8" required/>
              <div class="form-text">Minimum 8 characters.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <input type="password" th:field="*{confirmPassword}" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
